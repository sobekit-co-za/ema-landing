server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing. The app now serves real client-side routes (/modules,
    # /modules/:id, /faq, /help, /news). Without this, nginx looks for a file at
    # that path and returns 404 on any direct visit, refresh or shared link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Demo screencasts and posters: large, static, and versioned by filename.
    location /demos/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # mp4 is already compressed; gzip would only burn CPU.
    location ~* \.(mp4|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
