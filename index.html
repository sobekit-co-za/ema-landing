    <!--
      Resolve the language before first paint, so an Arabic visitor never sees
      a flash of left-to-right layout. This mirrors src/content/locale.js,
      which is the source of truth and re-applies the same values on boot.
      Change the order in one place and change it in the other.
    -->
    <script>
      (function () {
        try {
          var rtl = ["ar"];
          var supported = ["en", "ar", "fr", "pt", "es"];
          var key = "ema:locale";

          var q = new URLSearchParams(location.search).get("lang");
          if (supported.indexOf(q) > -1) localStorage.setItem(key, q);

          var l = supported.indexOf(q) > -1 ? q : localStorage.getItem(key);

          if (supported.indexOf(l) === -1) {
            // First visit: meet the visitor in their browser's language.
            var tags = navigator.languages || [navigator.language];
            l = null;
            for (var i = 0; i < tags.length && !l; i++) {
              var base = String(tags[i] || "").toLowerCase().split("-")[0];
              if (supported.indexOf(base) > -1) l = base;
            }
          }

          if (!l) return; // Keep the English default already on <html>.
          document.documentElement.lang = l;
          document.documentElement.dir = rtl.indexOf(l) > -1 ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>

    <!--
      One build serves all five languages and the URL never encodes which one,
      so there are no per-language URLs to declare as hreflang alternates.
      Adding them would mean moving the locale into the path (/ar/…) first.
    -->
