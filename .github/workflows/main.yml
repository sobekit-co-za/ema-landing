# One build, every language.
#
# The site used to ship as four branches and four Docker images, one per
# language. src/content/ now carries all four locales side by side and the
# visitor picks one from the header switcher, so master alone is deployed.
#
# The arabic / french / portuguese branches are kept for history but no longer
# build. On the server, /opt/ema-landing/docker-compose.yml still defines the
# ema-app-ar, ema-app-fr and ema-app-pt services; those containers can be
# stopped and removed once this deploy is confirmed working.
name: Deploy EMA Landing Page

on:
  push:
    branches:
      - master

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/ema-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Selects the chatbot brain in the built bundle. Drop back to "local"
        # to turn Gemini off in production without touching any code.
        build-args: |
          VITE_CHATBOT_ENGINE=gemini
        secrets: |
          VITE_GEMINI_KEY_1=${{ secrets.VITE_GEMINI_KEY_1 }}
          VITE_GEMINI_KEY_2=${{ secrets.VITE_GEMINI_KEY_2 }}
          VITE_GEMINI_KEY_3=${{ secrets.VITE_GEMINI_KEY_3 }}
          VITE_GEMINI_KEY_4=${{ secrets.VITE_GEMINI_KEY_4 }}

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT || 22 }}
        # ema-app-en is the compose service that already serves the main
        # domain. It is kept under that name so the existing compose file and
        # reverse proxy keep working; it now serves all four languages.
        script: |
          cd /opt/ema-landing
          docker compose pull ema-app-en || docker-compose pull ema-app-en
          docker compose up -d ema-app-en || docker-compose up -d ema-app-en
          docker image prune -f
